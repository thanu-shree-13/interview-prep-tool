version: 1

env:
  variables:
    REACT_APP_API_URL: "http://3.106.187.87:5000"

applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: build
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      appRoot: frontend